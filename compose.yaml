name: flowmind
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowmind}
      POSTGRES_USER: ${POSTGRES_USER:-flowmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowmind-local-only}
    ports: ["${FLOWMIND_POSTGRES_PORT:-5433}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${FLOWMIND_REDIS_PORT:-6380}:6379"]
    volumes: ["redis-data:/data"]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-flowmind}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-flowmind-local-only}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowmind-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flowmind-local-only}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  api:
    profiles: ["app"]
    build: { context: ./apps/api }
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmind}
      POSTGRES_USER: ${POSTGRES_USER:-flowmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowmind-local-only}
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-flowmind}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-flowmind-local-only}
      FLOWMIND_JWT_SECRET: ${FLOWMIND_JWT_SECRET:-local-development-secret-change-me}
      FLOWMIND_ENCRYPTION_KEY: ${FLOWMIND_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      FLOWMIND_AI_URL: http://ai-service:8081
      FLOWMIND_AI_SERVICE_TOKEN: ${FLOWMIND_AI_SERVICE_TOKEN:-local-development-ai-token}
      FLOWMIND_WORKER_ENABLED: "false"
      FLOWMIND_EXECUTION_STALE_AFTER_SECONDS: "60"
      FLOWMIND_EXECUTION_RECOVERY_POLL_DELAY_MS: "5000"
      FLOWMIND_WEB_BASE_URL: http://localhost:${FLOWMIND_WEB_PORT:-3002}
      FLOWMIND_OIDC_ENABLED: ${FLOWMIND_OIDC_ENABLED:-false}
      FLOWMIND_OIDC_ISSUER_URI: ${FLOWMIND_OIDC_ISSUER_URI:-}
      FLOWMIND_OIDC_CLIENT_ID: ${FLOWMIND_OIDC_CLIENT_ID:-}
      FLOWMIND_OIDC_CLIENT_SECRET: ${FLOWMIND_OIDC_CLIENT_SECRET:-}
      FLOWMIND_OIDC_AUTO_LINK_VERIFIED_EMAIL: ${FLOWMIND_OIDC_AUTO_LINK_VERIFIED_EMAIL:-false}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_started }
      ai-service: { condition: service_started }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 20
  worker:
    profiles: ["app"]
    image: flowmind-api:latest
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmind}
      POSTGRES_USER: ${POSTGRES_USER:-flowmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowmind-local-only}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-flowmind}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-flowmind-local-only}
      FLOWMIND_JWT_SECRET: ${FLOWMIND_JWT_SECRET:-local-development-secret-change-me}
      FLOWMIND_ENCRYPTION_KEY: ${FLOWMIND_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      FLOWMIND_AI_URL: http://ai-service:8081
      FLOWMIND_AI_SERVICE_TOKEN: ${FLOWMIND_AI_SERVICE_TOKEN:-local-development-ai-token}
      FLOWMIND_WORKER_ENABLED: "true"
      FLOWMIND_CONTROL_PLANE_ENABLED: "false"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_started }
      ai-service: { condition: service_started }
    deploy:
      replicas: ${FLOWMIND_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: 768M
  ai-service:
    profiles: ["app"]
    build: { context: ./apps/ai-service }
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FLOWMIND_AI_SERVICE_TOKEN: ${FLOWMIND_AI_SERVICE_TOKEN:-local-development-ai-token}
  web:
    profiles: ["app"]
    build: { context: ./apps/web }
    environment:
      FLOWMIND_API_URL: http://api:8080
      FLOWMIND_PUBLIC_API_URL: http://localhost:${FLOWMIND_API_PORT:-8080}
      FLOWMIND_PUBLIC_HOST: localhost:${FLOWMIND_WEB_PORT:-3002}
      FLOWMIND_AI_URL: http://ai-service:8081
      FLOWMIND_AI_SERVICE_TOKEN: ${FLOWMIND_AI_SERVICE_TOKEN:-local-development-ai-token}
      FLOWMIND_DEMO_ENABLED: ${FLOWMIND_DEMO_ENABLED:-false}
      FLOWMIND_DEMO_EMAIL: ${FLOWMIND_DEMO_EMAIL:-}
      FLOWMIND_DEMO_PASSWORD: ${FLOWMIND_DEMO_PASSWORD:-}
    ports: ["${FLOWMIND_WEB_PORT:-3002}:3000"]
    depends_on: [api, ai-service]
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes: ["./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus-data:/prometheus"]
    ports: ["9090:9090"]
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local}
    volumes: ["grafana-data:/var/lib/grafana", "./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3001:3000"]
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:

