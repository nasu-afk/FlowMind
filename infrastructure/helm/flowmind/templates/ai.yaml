apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-ai, labels: { app.kubernetes.io/name: flowmind-ai } }
spec:
  replicas: {{ .Values.ai.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: flowmind-ai } }
  template:
    metadata: { labels: { app.kubernetes.io/name: flowmind-ai } }
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: ai
          image: "{{ .Values.ai.image.repository }}:{{ .Values.ai.image.tag }}"
          imagePullPolicy: {{ .Values.ai.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8081 }]
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: {{- toYaml .Values.ai.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-ai }
spec: { selector: { app.kubernetes.io/name: flowmind-ai }, ports: [{ name: http, port: 8081, targetPort: http }] }

