apiVersion: v1
kind: ServiceAccount
metadata: { name: {{ .Release.Name }} }
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ .Release.Name }}-api }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: flowmind-api } } }
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-default-deny }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-dns-egress }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: {} }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-web }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-web } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: {} }]
      ports: [{ protocol: TCP, port: 3000 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-api } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-ai } }
      ports: [{ protocol: TCP, port: 8081 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-api }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-web } }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 5672 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-worker }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-worker } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-ai } }
      ports: [{ protocol: TCP, port: 8081 }]
    - ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 5672 }
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-ai }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-ai } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-web } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: flowmind-worker } }
      ports: [{ protocol: TCP, port: 8081 }]
  egress:
    - ports: [{ protocol: TCP, port: 443 }]
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ .Release.Name }}-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }}-api }
  minReplicas: 2
  maxReplicas: 20
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]

