apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-web, labels: { app.kubernetes.io/name: flowmind-web } }
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: flowmind-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: flowmind-web } }
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: FLOWMIND_API_URL, value: "http://{{ .Release.Name }}-api:8080" }
            - { name: FLOWMIND_AI_URL, value: "http://{{ .Release.Name }}-ai:8081" }
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: next-cache, mountPath: /app/.next/cache }]
      volumes: [{ name: next-cache, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-web }
spec: { selector: { app.kubernetes.io/name: flowmind-web }, ports: [{ name: http, port: 3000, targetPort: http }] }

